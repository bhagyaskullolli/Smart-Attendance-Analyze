{% extends "base.html" %}{% block title %}Edit Subject{% endblock %}{% block content %}
<div class="page-heading"><div><h2>Edit Subject</h2><p>Update subject information.</p></div><a class="btn btn-outline-primary" href="{{ url_for('subjects') }}">Back</a></div>
<section class="panel form-panel"><form method="post"><label>Subject Code *</label><input class="form-control mb-3" name="code" value="{{ subject.code }}" required><label>Subject Name *</label><input class="form-control mb-3" name="name" value="{{ subject.name }}" required><label>Semester</label><input class="form-control mb-3" name="semester" value="{{ subject.semester or '' }}"><label>Teacher</label><input class="form-control mb-3" name="teacher" value="{{ subject.teacher or '' }}"><button class="btn btn-primary">Save Changes</button></form></section>{% endblock %}
