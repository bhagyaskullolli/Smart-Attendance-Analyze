{% extends "base.html" %}{% block title %}Edit Student{% endblock %}{% block content %}
<div class="page-heading"><div><h2>Edit Student</h2><p>Update student information.</p></div><a class="btn btn-outline-primary" href="{{ url_for('students') }}">Back</a></div>
<section class="panel form-panel"><form method="post"><label>Register Number *</label><input class="form-control mb-3" name="register_no" value="{{ student.register_no }}" required><label>Student Name *</label><input class="form-control mb-3" name="name" value="{{ student.name }}" required><label>Email</label><input class="form-control mb-3" name="email" value="{{ student.email or '' }}"><label>Phone</label><input class="form-control mb-3" name="phone" value="{{ student.phone or '' }}"><label>Class / Semester</label><input class="form-control mb-3" name="class_name" value="{{ student.class_name or '' }}"><button class="btn btn-primary">Save Changes</button></form></section>{% endblock %}
